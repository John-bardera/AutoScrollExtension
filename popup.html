<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
  <title>Auto Scroll</title>
</head>
<body>
  <header class="header">
    <h1 data-i18n="title"></h1>
    <button id="toggle-btn" class="toggle-btn"></button>
  </header>

  <section class="section">
    <h2 data-i18n="secSpeed"></h2>
    <div class="speed-row">
      <input id="speed-range" type="range" min="10" max="1000" step="10" />
      <input id="speed-number" type="number" min="10" max="1000" step="10" />
      <span class="unit">px/s</span>
    </div>
  </section>

  <section class="section">
    <h2 data-i18n="secBehavior"></h2>
    <label class="radio-row">
      <input type="radio" name="behavior" value="resume" />
      <span data-i18n="behaviorResume"></span>
    </label>
    <label class="radio-row">
      <input type="radio" name="behavior" value="pause" />
      <span data-i18n="behaviorPause"></span>
    </label>
  </section>

  <section class="section">
    <h2 data-i18n="secLanguage"></h2>
    <select id="language-select" class="language-select">
      <option value="ja">日本語</option>
      <option value="en">English</option>
    </select>
  </section>

  <footer class="footer" data-i18n="footer"></footer>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
